# The blog's pages are generated by tools/blog/build.mjs and committed, so
# GitHub Pages serves plain files with no build step. This checks that the
# committed pages are what the posts produce: it rebuilds, without drafts,
# and fails if anything under blog/ or sitemap.xml would change (a post
# edited without rebuilding, or a --drafts preview committed by mistake).
#
# Other writers push to main too: the NeoSCAD repository's update-feed job
# pushes updates/, and /try syncs replace try/. The path filter keeps this
# check off those pushes, and it never pushes or blocks anything itself:
# a failure is a red mark on the commit, to be fixed by rebuilding.
# index.html is in the filter because the blog's pages copy its header and
# footer; try/examples/manifest.json because `try=` links are checked
# against it.
name: Blog

on:
  push:
    branches: [main]
    paths:
      - "blog/**"
      - "tools/blog/**"
      - "index.html"
      - "sitemap.xml"
      - "try/examples/manifest.json"
      - ".github/workflows/blog.yml"
  pull_request:
    paths:
      - "blog/**"
      - "tools/blog/**"
      - "index.html"
      - "sitemap.xml"
      - "try/examples/manifest.json"
      - ".github/workflows/blog.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: tools/blog/package-lock.json
      - name: Install the renderer's pinned dependencies
        run: npm ci --ignore-scripts
        working-directory: tools/blog
      - name: Test the renderer
        run: npm test
        working-directory: tools/blog
      - name: Rebuild the blog
        run: node tools/blog/build.mjs
      - name: The committed pages match the posts
        run: |
          if [ -n "$(git status --porcelain -- blog sitemap.xml)" ]; then
            echo "::error::The committed blog pages are stale. Run 'node tools/blog/build.mjs' (without --drafts) and commit the result."
            git status --short -- blog sitemap.xml
            git diff --stat -- blog sitemap.xml
            exit 1
          fi
